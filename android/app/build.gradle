plugins {
    id "com.android.application"
    id "kotlin-android"
    // FlutterFire — applied by the Flutter Gradle plugin
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"       // Firebase
    id "com.google.firebase.crashlytics"       // Crashlytics
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.gasgojo.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.gasgojo.app"
        minSdkVersion 24           // Android 7.0 — covers 95%+ of devices
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName

        // Enables multidex on API < 21 (not needed given minSdk 24, but good practice)
        multiDexEnabled true

        // Inject Maps API key from local.properties into AndroidManifest
        manifestPlaceholders = [GOOGLE_MAPS_API_KEY: localProperties.getProperty('GOOGLE_MAPS_API_KEY', '')]
    }

    signingConfigs {
        release {
            // key.properties holds storeFile, storePassword, keyAlias, keyPassword
            // This file must NOT be committed to version control
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Crashlytics mapping file
            firebaseCrashlytics {
                mappingFileUploadEnabled true
                nativeSymbolUploadEnabled false
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Multidex support (not strictly required at minSdk 24, defensive inclusion)
    implementation 'androidx.multidex:multidex:2.0.1'
}
