  <rect x="6" y="26" width="13" height="2" rx="1" fill="#FB923C"/>
  <!-- Dollar sign on pump body -->
  <text x="12.5" y="24.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#4ADE80">$</text>
</svg>
