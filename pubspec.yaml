name: gasgojo
description: Find the cheapest gas near you — real-time prices, alerts, and favorites.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  cloud_functions: ^5.1.0
  # firebase_messaging, firebase_analytics, firebase_remote_config, firebase_crashlytics
  # are not yet implemented — add back when features are built out

  # Maps & Location
  google_maps_flutter: ^2.7.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # State Management & DI
  flutter_bloc: ^8.1.6
  get_it: ^8.0.0

  # Navigation
  go_router: ^14.2.7

  # Network
  dio: ^5.7.0
  connectivity_plus: ^6.0.5

  # Local Storage
  hive_flutter: ^1.1.0

  # UI
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  rxdart: ^0.28.0

  # Google Sign-In
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/brands/
    - assets/illustrations/
